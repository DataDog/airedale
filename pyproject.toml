[project]
name = "airedale"
dynamic = ["version"]
description = "Config-driven evaluation harness for agentic LLM runs, reporting to Datadog LLM Observability Experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Datadog, Inc." }]
keywords = ["llm", "evals", "datadog", "llmobs", "mcp", "agents", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "ddtrace==4.16.0",
    "anthropic==1.15.0",
    "openai==3.35.1",
    "claude-agent-sdk==0.2.168",
    "openai-codex==0.163.0",
    "mcp==1.30.0",
    "httpx==0.28.1",
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.414",
    "ruff>=0.16.0",
]

[project.scripts]
airedale = "airedale.cli:main"

[project.urls]
Homepage = "https://github.com/DataDog/airedale"
Repository = "https://github.com/DataDog/airedale"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# CI resolves with pre-releases allowed. Set it here too, so that a local
# `uv lock` / `uv sync` produces the same uv.lock as CI expects.
prerelease = "allow"

[tool.hatch.version]
path = "src/airedale/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/airedale"]

[tool.ruff]
line-length = 120
target-version = "py311"
fix = true
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["airedale"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
